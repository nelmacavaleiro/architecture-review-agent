schema_version: "1.1"
name: F5
description: "Review test F5, see tests/answer-keys/F5.md"
tags: [review, f]
runs: 1
context:
  scaffold_script: setup.sh
execution:
  prompt: |
    Please run an architecture review check on the proposal `proposals/F5-reporting-dashboard.md`. The team's architecture files are in this folder. Save the review as `reviews/F5-reporting-dashboard-review.md`.
  max_turns: 60
  timeout_seconds: 1200
  allowed_tools: [Read, Glob, Grep, Skill, Write]
