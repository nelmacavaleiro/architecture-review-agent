schema_version: "1.1"
name: W4
description: "Review test W4, see tests/answer-keys/W4.md"
tags: [review, w]
runs: 1
context:
  scaffold_script: setup.sh
execution:
  prompt: |
    Please run an architecture review check on the proposal `proposals/W4-resident-chatbot.md`. The team's architecture files are in this folder. Save the review as `reviews/W4-resident-chatbot-review.md`.
  max_turns: 60
  timeout_seconds: 1200
  allowed_tools: [Read, Glob, Grep, Skill, Write]
